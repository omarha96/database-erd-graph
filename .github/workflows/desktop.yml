# Builds the ERD Viewer desktop app (Tauri + the bundled Node backend, see
# desktop/) for Linux, Windows and macOS. Each platform builds on its own
# native runner.
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v2.0.0
# to also attach the installers to a GitHub release.
name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26 # --build-sea (single executable) needs Node 25.5+
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev

      - run: npm ci

      - name: Build the desktop app
        env:
          DATABASE_URL: ''
          PGPASSWORD: ''
        run: npm run desktop

      - name: Collect installers
        shell: bash
        run: find desktop/src-tauri/target/release/bundle \( -name '*.deb' -o -name '*.dmg' -o -name '*.exe' \) -exec cp {} . \;

      - uses: actions/upload-artifact@v4
        with:
          name: ERDViewer-${{ runner.os }}
          path: |
            *.deb
            *.dmg
            *.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.dmg
            *.exe
